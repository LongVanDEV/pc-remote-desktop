name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install || true
      - name: Lint stub
        run: node scripts/lint-stub.js
      - name: Test stub
        run: node scripts/test-stub.js
