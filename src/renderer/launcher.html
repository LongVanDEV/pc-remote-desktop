<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>PC Remote</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --text: #e6edf3;
    --muted: #7d8b99;
    --host: #3ba7a0;
    --viewer: #d98e3f;
    --accent: #7c8cf8;
    --danger: #e2574c;
    --online: #3ecf8e;
    --offline: #4b5563;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .center {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  h1 { font-size: 22px; font-weight: 600; margin: 0; }
  p.sub { color: var(--muted); margin: -10px 0 4px; font-size: 14px; }
  button { font-family: inherit; cursor: pointer; border: none; }

  .google-btn {
    display: flex; align-items: center; gap: 10px;
    background: #fff; color: #1f2733; font-weight: 600; font-size: 15px;
    padding: 12px 22px; border-radius: 8px;
  }
  .google-btn:disabled { opacity: 0.6; cursor: default; }

  #dashboard { display: none; max-width: 640px; margin: 0 auto; padding: 32px 24px 60px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
  .account { display: flex; align-items: center; gap: 10px; }
  .account img { width: 32px; height: 32px; border-radius: 50%; }
  .account .name { font-size: 14px; font-weight: 600; }
  .account .email { font-size: 12px; color: var(--muted); }
  #signOutBtn { background: transparent; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 4px; }

  .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 26px 0 10px; }

  .device-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel); border: 1px solid #1f2733; border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .device-info { display: flex; align-items: center; gap: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--offline); flex-shrink: 0; }
  .dot.online { background: var(--online); }
  .device-name { font-size: 15px; font-weight: 600; }
  .device-meta { font-size: 12px; color: var(--muted); }
  .device-actions { display: flex; align-items: center; gap: 8px; }
  .connect-btn {
    background: var(--viewer); color: #1a1206; font-weight: 600; font-size: 13px;
    padding: 8px 16px; border-radius: 7px;
  }
  .connect-btn:disabled { background: #2a3340; color: var(--muted); cursor: not-allowed; }
  .manage-btn {
    background: var(--panel); border: 1px solid #1f2733; color: var(--muted);
    width: 33px; height: 33px; border-radius: 7px; font-size: 15px;
  }
  .empty { color: var(--muted); font-size: 13px; padding: 4px 0 8px; }

  .host-btn {
    width: 100%; background: var(--host); color: #06211f; font-weight: 700; font-size: 14px;
    padding: 13px 16px; border-radius: 9px;
  }

  .invite-row { display: flex; gap: 8px; }
  .invite-row input {
    flex: 1; background: var(--panel); border: 1px solid #1f2733; color: var(--text);
    font-family: ui-monospace, "SF Mono", Consolas, monospace; letter-spacing: 3px; text-transform: uppercase;
    padding: 10px 12px; border-radius: 8px; font-size: 14px;
  }
  .invite-row button {
    background: var(--accent); color: #10132a; font-weight: 600; font-size: 13px; padding: 0 18px; border-radius: 8px;
  }
  #msg { font-size: 13px; margin-top: 8px; min-height: 16px; }
  #msg.error { color: var(--danger); }
  #msg.ok { color: var(--online); }
  .settings-box { margin-top: 24px; background: var(--panel); border: 1px solid #1f2733; border-radius: 10px; padding: 14px 16px; }
  .settings-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 10px; }
  .setting { display: flex; align-items: center; gap: 9px; margin: 8px 0; font-size: 13px; color: var(--text); }
  .setting small { color: var(--muted); }
  .setting input { width: 16px; height: 16px; }
  #settingsMsg { font-size: 12px; color: var(--muted); min-height: 15px; margin: 8px 0 0; }
</style>
</head>
<body>
  <div id="signedOut" class="center">
    <div style="text-align:center;">
      <h1>Remote Desktop</h1>
      <p class="sub">Sign in to see and control your PCs</p>
    </div>
    <button class="google-btn" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
      </svg>
      Sign in with Google
    </button>
    <p id="signInMsg" style="color: var(--danger); font-size: 13px; min-height: 16px;"></p>
  </div>

  <div id="dashboard">
    <div class="topbar">
      <div class="account">
        <img id="avatar" src="" alt="" style="display:none;" />
        <div>
          <div class="name" id="accountName"></div>
          <div class="email" id="accountEmail"></div>
        </div>
      </div>
      <button id="signOutBtn">Sign out</button>
    </div>

    <div class="section-title">My PCs</div>
    <div id="deviceList"></div>
    <div id="deviceEmpty" class="empty" style="display:none;">No PCs yet — host this one, or add one below.</div>

    <button class="host-btn" id="hostBtn">Host this PC</button>

    <div class="section-title">Add a PC</div>
    <div class="invite-row">
      <input id="inviteInput" maxlength="6" placeholder="INVITE CODE" />
      <button id="inviteBtn">Add</button>
    </div>
    <p id="msg"></p>

    <div class="settings-box">
      <div class="settings-title">Background mode</div>
      <label class="setting"><input type="checkbox" id="autoStartCheck" /> <span>Start with Windows</span> <small>(app opens in the tray)</small></label>
      <label class="setting"><input type="checkbox" id="autoHostCheck" /> <span>Auto-host in background</span> <small>(starts hosting without opening a window)</small></label>
      <p id="settingsMsg"></p>
    </div>
  </div>

  <script src="launcher.js"></script>
</body>
</html>
