<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Manage device</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --text: #e6edf3;
    --muted: #7d8b99;
    --accent: #7c8cf8;
    --danger: #e2574c;
    --online: #3ecf8e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 600px; margin: 0 auto; padding: 28px 24px 60px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 22px; }
  .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 26px 0 10px; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel); border: 1px solid #1f2733; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px; gap: 10px;
  }
  .row .main { min-width: 0; }
  .row .primary { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .row .meta { font-size: 12px; color: var(--muted); }
  .badge {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700;
    padding: 2px 7px; border-radius: 5px; background: #1f2733; color: var(--muted); margin-right: 6px;
  }
  .badge-global { background: var(--danger); color: #2a0d0a; }
  .actions { display: flex; gap: 6px; flex-shrink: 0; }
  button { font-family: inherit; cursor: pointer; border: none; border-radius: 7px; font-size: 12px; padding: 7px 12px; }
  .btn-neutral { background: #1f2733; color: var(--text); }
  .btn-danger { background: var(--danger); color: #2a0d0a; font-weight: 600; }
  .empty { color: var(--muted); font-size: 13px; padding: 4px 0 8px; }

  .ban-form { background: var(--panel); border: 1px solid #1f2733; border-radius: 10px; padding: 14px; }
  .ban-form .fields { display: flex; gap: 8px; margin-bottom: 8px; }
  select, input[type="text"] {
    background: #0b0f14; border: 1px solid #1f2733; color: var(--text);
    border-radius: 7px; padding: 8px 10px; font-size: 13px; font-family: inherit;
  }
  select { flex: 0 0 100px; }
  input[type="text"] { flex: 1; }
  .ban-form .scope { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .btn-accent { background: var(--accent); color: #10132a; font-weight: 600; padding: 9px 16px; }

  .danger-zone { margin-top: 34px; border-top: 1px solid #1f2733; padding-top: 18px; }
  #msg { font-size: 13px; margin-top: 10px; min-height: 16px; }
  #msg.error { color: var(--danger); }
  #msg.ok { color: var(--online); }
</style>
</head>
<body>
  <div class="wrap">
    <h1 id="deviceTitle">Manage</h1>
    <p class="sub">Access control for this PC</p>

    <div class="section-title">People with access</div>
    <div id="pairedList"></div>
    <div id="pairedEmpty" class="empty" style="display:none;">No one else has access — invites you generate will show up here once redeemed.</div>

    <div class="section-title">Bans</div>
    <div id="banList"></div>
    <div id="banEmpty" class="empty" style="display:none;">No one is banned.</div>

    <div class="ban-form">
      <div class="fields">
        <select id="banKind">
          <option value="email">Email</option>
          <option value="hwid">HWID</option>
          <option value="ip">IP</option>
        </select>
        <input type="text" id="banValue" placeholder="Value to ban" />
      </div>
      <input type="text" id="banReason" placeholder="Reason (optional)" style="width:100%; margin-bottom:10px;" />
      <select id="banScope" style="width:100%; margin-bottom:10px;">
        <option value="device">This PC only</option>
        <option value="owner_all">All my PCs</option>
      </select>
      <button class="btn-accent" id="banBtn">Ban</button>
    </div>
    <p id="msg"></p>

    <div class="danger-zone">
      <div class="section-title" style="margin-top:0;">Danger zone</div>
      <button class="btn-danger" id="deleteDeviceBtn">Remove this PC</button>
    </div>
  </div>
  <script src="manage.js"></script>
</body>
</html>
