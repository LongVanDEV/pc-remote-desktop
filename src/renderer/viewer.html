<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Viewer</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --text: #e6edf3;
    --muted: #7d8b99;
    --viewer: #d98e3f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body {
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }
  #setup {
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #1f2733;
  }
  #deviceLabel { font-size: 15px; font-weight: 600; color: var(--viewer); }
  #status { color: var(--muted); font-size: 13px; }
  #remoteVideo { flex: 1; width: 100%; object-fit: contain; background: #000; cursor: none; }
</style>
</head>
<body>
  <div id="setup">
    <div id="deviceLabel">Connecting…</div>
    <div id="status"></div>
  </div>
  <video id="remoteVideo" autoplay playsinline></video>
  <script src="viewer.js"></script>
</body>
</html>
